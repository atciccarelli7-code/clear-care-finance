name: Apply 403b email disclosure patch

on:
  push:
    branches:
      - agent/403b-match-decision-outcome
    paths:
      - .github/workflows/apply-403b-email-disclosure-patch.yml

permissions:
  contents: write

jobs:
  patch-email-disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403b-match-decision-outcome
          fetch-depth: 0
      - name: Add explicit estimate data-flow notice
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/calculators/Calc403bEmailEstimate.tsx")
          text = path.read_text(encoding="utf-8")
          old = '<p className="mt-1 text-xs leading-relaxed text-muted-foreground">Email is optional. The decision outcome above is complete without providing contact information.</p>'
          new = '<p className="mt-1 text-xs leading-relaxed text-muted-foreground">Email is optional. Submitting sends your email address and the displayed estimate fields to CAF&apos;s email provider for delivery; ordinary calculator use does not send those values.</p>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one disclosure match but found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit email data-flow notice
        run: |
          if git diff --quiet; then
            echo "No disclosure change was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/calculators/Calc403bEmailEstimate.tsx
          git commit -m "Disclose 403b email estimate transmission"
          git push origin HEAD:agent/403b-match-decision-outcome
