name: Apply 403b email payload patch

on:
  push:
    branches:
      - agent/403b-match-decision-outcome
    paths:
      - .github/workflows/apply-403b-email-payload-patch.yml

permissions:
  contents: write

jobs:
  patch-email-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403b-match-decision-outcome
          fetch-depth: 0
      - name: Replace internal values with readable email fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/calculators/Calc403bEmailEstimate.tsx")
          text = path.read_text(encoding="utf-8")
          old_helper = 'const toNumber = (value: string) => value.trim() === "" ? Number.NaN : Number(value);\n'
          new_helper = '''const toNumber = (value: string) => value.trim() === "" ? Number.NaN : Number(value);\nconst formatCurrency = (value: number) => new Intl.NumberFormat("en-US", {\n  style: "currency",\n  currency: "USD",\n  maximumFractionDigits: 0,\n}).format(Number.isFinite(value) ? value : 0);\nconst payFrequencyLabel = (paychecksPerYear: string) => {\n  if (paychecksPerYear === "52") return "Weekly (52 paychecks/year)";\n  if (paychecksPerYear === "26") return "Biweekly (26 paychecks/year)";\n  if (paychecksPerYear === "24") return "Semi-monthly (24 paychecks/year)";\n  return "Monthly (12 paychecks/year)";\n};\n'''
          old_payload = '''          estimate: {\n            hourly: values.hourlyWage,\n            hoursWeek: values.hoursPerWeek,\n            payFrequency: values.paychecksPerYear,\n            contributionPercent: values.employeeContributionPercent,\n            employerMatchPercent: values.matchFormula,\n            contributionType: values.contributionType,\n            grossPerCheck: decision.grossPaycheck.toFixed(2),\n            employeePerCheck: decision.employeeContributionPerPaycheck.toFixed(2),\n            annualEmployee: decision.annualEmployeeContribution.toFixed(2),\n            annualEmployer: decision.annualEmployerContribution === null ? "not-estimated" : decision.annualEmployerContribution.toFixed(2),\n            totalRetirement: decision.annualTotalContribution === null ? "not-estimated" : decision.annualTotalContribution.toFixed(2),\n            taxableReduction: values.contributionType === "traditional" ? decision.annualEmployeeContribution.toFixed(2) : "0",\n            estimatedTaxSavings: decision.estimatedAnnualFederalTaxReduction.toFixed(2),\n            decisionSummary: decision.view.portableSummary,\n          },'''
          new_payload = '''          estimate: {\n            hourly: formatCurrency(toNumber(values.hourlyWage)),\n            hoursWeek: `${values.hoursPerWeek} hours/week`,\n            payFrequency: payFrequencyLabel(values.paychecksPerYear),\n            contributionPercent: `${values.employeeContributionPercent}%`,\n            employerMatchPercent: decision.view.assumptions.find((assumption) => assumption.label === "Employer formula")?.value ?? "Not estimated—verify the plan formula",\n            contributionType: values.contributionType === "traditional" ? "Traditional" : "Roth",\n            grossPerCheck: formatCurrency(decision.grossPaycheck),\n            employeePerCheck: formatCurrency(decision.employeeContributionPerPaycheck),\n            annualEmployee: formatCurrency(decision.annualEmployeeContribution),\n            annualEmployer: decision.annualEmployerContribution === null ? "Not estimated" : formatCurrency(decision.annualEmployerContribution),\n            totalRetirement: decision.annualTotalContribution === null ? "Not estimated" : formatCurrency(decision.annualTotalContribution),\n            taxableReduction: formatCurrency(values.contributionType === "traditional" ? decision.annualEmployeeContribution : 0),\n            estimatedTaxSavings: formatCurrency(decision.estimatedAnnualFederalTaxReduction),\n          },'''

          for old, new in ((old_helper, new_helper), (old_payload, new_payload)):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one payload match but found {count}: {old[:100]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit readable email payload
        run: |
          if git diff --quiet; then
            echo "No payload changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/calculators/Calc403bEmailEstimate.tsx
          git commit -m "Preserve readable 403b email estimates"
          git push origin HEAD:agent/403b-match-decision-outcome
