name: Apply 403b metadata patch

on:
  push:
    branches:
      - agent/403b-match-decision-outcome
    paths:
      - .github/workflows/apply-403b-metadata-patch.yml

permissions:
  contents: write

jobs:
  patch-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403b-match-decision-outcome
          fetch-depth: 0
      - name: Apply exact registry replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/data/tools.ts"): [
                  (
                      '    description: "Estimate per-paycheck contributions, annual savings, and a rough employer-match amount.",',
                      '    description: "Estimate a payroll contribution, model common employer formulas, and identify plan terms to verify before changing payroll.",',
                  ),
                  (
                      '    href: "/tools/403b-paycheck-calculator",\n    relatedArticle: { label: "How hospital 403(b) matching works", href: "/articles/how-hospital-403b-matching-works" },',
                      '    href: "/tools/403b-paycheck-calculator",\n    decisionProductId: "retirement_403b_contribution",\n    relatedArticle: { label: "How hospital 403(b) matching works", href: "/articles/how-hospital-403b-matching-works" },',
                  ),
              ],
              Path("src/lib/seoRegistry.ts"): [
                  (
                      '  "/tools/403b-paycheck-calculator": {\n    title: "403(b) Paycheck Contribution Calculator",\n    description: "Estimate your 403(b) contribution per paycheck, annual contribution, employer match, and progress toward the annual contribution limit.",\n    kind: "tool",\n  },',
                      '  "/tools/403b-paycheck-calculator": {\n    title: "403(b) Paycheck and Employer Match Calculator",\n    description: "Estimate a 403(b) payroll contribution, model common employer matching or non-elective formulas, and identify plan terms to verify before changing payroll.",\n    kind: "tool",\n  },',
                  ),
              ],
          }

          for path, path_replacements in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in path_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {path} but found {count}: {old[:100]}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit exact registry updates
        run: |
          if git diff --quiet; then
            echo "No registry changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tools.ts src/lib/seoRegistry.ts
          git commit -m "Align 403b tool and prerender metadata"
          git push origin HEAD:agent/403b-match-decision-outcome
