name: Apply 403b zero-contribution state patch

on:
  push:
    branches:
      - agent/403b-match-decision-outcome
    paths:
      - .github/workflows/apply-403b-zero-contribution-state-patch.yml

permissions:
  contents: write

jobs:
  patch-state-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403b-match-decision-outcome
          fetch-depth: 0
      - name: Correct state precedence and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          domain = Path("src/lib/retirement403bDecision.ts")
          text = domain.read_text(encoding="utf-8")
          old = '''const determineState = (\n  input: Retirement403bDecisionInput,\n  annualEmployerContribution: number | null,\n): Retirement403bDecisionState => {\n  if (input.matchFormula === "unknown_or_tiered") return "verify_match_formula";\n  if ((annualEmployerContribution ?? 0) <= 0) return "no_employer_contribution_identified";\n  if (input.matchFormula === "non_elective") return "non_elective_contribution";\n  return input.employeeContributionPercent < (input.employerMatchCapPercent ?? 0)\n    ? "below_full_match"\n    : "capturing_full_match";\n};'''
          new = '''const determineState = (\n  input: Retirement403bDecisionInput,\n  annualEmployerContribution: number | null,\n): Retirement403bDecisionState => {\n  if (input.matchFormula === "unknown_or_tiered") return "verify_match_formula";\n  if (input.matchFormula === "non_elective") {\n    return (annualEmployerContribution ?? 0) > 0\n      ? "non_elective_contribution"\n      : "no_employer_contribution_identified";\n  }\n\n  const matchCap = input.employerMatchCapPercent ?? 0;\n  const matchRate = input.matchFormula === "full_match_up_to"\n    ? 100\n    : input.employerMatchRatePercent ?? 0;\n  if (matchCap <= 0 || matchRate <= 0) return "no_employer_contribution_identified";\n\n  return input.employeeContributionPercent < matchCap\n    ? "below_full_match"\n    : "capturing_full_match";\n};'''
          if text.count(old) != 1:
              raise SystemExit("Could not find the expected determineState block exactly once")
          domain.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("src/test/retirement403bDecision.test.ts")
          test_text = tests.read_text(encoding="utf-8")
          anchor = '''  it("models a non-elective contribution independently of the employee deferral", () => {'''
          addition = '''  it("treats a zero employee deferral under a valid match as below the match threshold", () => {\n    const decision = evaluateRetirement403bDecision({\n      ...baseInput,\n      employeeContributionPercent: 0,\n    });\n\n    expect(decision.state).toBe("below_full_match");\n    expect(decision.annualEmployerContribution).toBe(0);\n    expect(decision.view.firstAction).toMatch(/smallest affordable contribution increase/i);\n  });\n\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit("Could not find the non-elective test anchor exactly once")
          tests.write_text(test_text.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY
      - name: Commit state-order correction
        run: |
          if git diff --quiet; then
            echo "No state-order changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/retirement403bDecision.ts src/test/retirement403bDecision.test.ts
          git commit -m "Correct zero-contribution 403b recommendation state"
          git push origin HEAD:agent/403b-match-decision-outcome
