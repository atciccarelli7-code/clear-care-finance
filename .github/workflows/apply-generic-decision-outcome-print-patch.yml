name: Apply generic decision outcome print patch

on:
  push:
    branches:
      - agent/403b-match-decision-outcome
    paths:
      - .github/workflows/apply-generic-decision-outcome-print-patch.yml

permissions:
  contents: write

jobs:
  patch-print-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403b-match-decision-outcome
          fetch-depth: 0
      - name: Replace private-loan-only print selectors
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path("src/print.css")
          css = css_path.read_text(encoding="utf-8")
          old = '''  /* Private student-loan pilot: print only the portable decision outcome. */
  body:has(#private-loan-decision-outcome) main * {
    visibility: hidden !important;
  }

  body:has(#private-loan-decision-outcome) #private-loan-decision-outcome,
  body:has(#private-loan-decision-outcome) #private-loan-decision-outcome * {
    visibility: visible !important;
  }

  body:has(#private-loan-decision-outcome) #private-loan-decision-outcome {
    position: absolute !important;
    inset: 0 auto auto 0 !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  body:has(#private-loan-decision-outcome) #private-loan-decision-outcome > article {
    overflow: visible !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  body:has(#private-loan-decision-outcome) #private-loan-decision-outcome > article > header {
    display: block !important;
  }

  body:has(#private-loan-decision-outcome) #private-loan-decision-outcome > article::before {
    content: "COMMUNITY ACQUIRED FINANCE\\A PRIVATE STUDENT LOAN DECISION SUMMARY";
    display: block;
    margin-bottom: 18pt;
    padding-bottom: 8pt;
    border-bottom: 1px solid #64748b;
    color: #0f172a;
    font-size: 9pt;
    font-weight: 800;
    letter-spacing: 0.08em;
    white-space: pre-line;
  }

  body:has(#private-loan-decision-outcome) #private-loan-decision-outcome a[href^="http"]::after {
    content: "\\A" attr(href);
    display: block;
    margin-top: 3pt;
    color: #475569;
    font-size: 8pt;
    font-weight: 400;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
'''
          new = '''  /* Decision Outcome Layer: print only the active portable decision outcome. */
  body:has([id^="decision-outcome-"]) main * {
    visibility: hidden !important;
  }

  body:has([id^="decision-outcome-"]) [id^="decision-outcome-"],
  body:has([id^="decision-outcome-"]) [id^="decision-outcome-"] * {
    visibility: visible !important;
  }

  body:has([id^="decision-outcome-"]) [id^="decision-outcome-"] {
    position: absolute !important;
    inset: 0 auto auto 0 !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  body:has([id^="decision-outcome-"]) [id^="decision-outcome-"] > article {
    overflow: visible !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  body:has([id^="decision-outcome-"]) [id^="decision-outcome-"] > article > header {
    display: block !important;
  }

  body:has([id^="decision-outcome-"]) [id^="decision-outcome-"] > article::before {
    content: "COMMUNITY ACQUIRED FINANCE\\A DECISION SUMMARY";
    display: block;
    margin-bottom: 18pt;
    padding-bottom: 8pt;
    border-bottom: 1px solid #64748b;
    color: #0f172a;
    font-size: 9pt;
    font-weight: 800;
    letter-spacing: 0.08em;
    white-space: pre-line;
  }

  body:has([id^="decision-outcome-"]) [id^="decision-outcome-"] a[href^="http"]::after {
    content: "\\A" attr(href);
    display: block;
    margin-top: 3pt;
    color: #475569;
    font-size: 8pt;
    font-weight: 400;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
'''
          if css.count(old) != 1:
              raise SystemExit(f"Expected one legacy print block, found {css.count(old)}")
          css_path.write_text(css.replace(old, new, 1), encoding="utf-8")

          test_path = Path("e2e/print-pdf-certification.spec.ts")
          test_text = test_path.read_text(encoding="utf-8")
          legacy = '"#private-loan-decision-outcome"'
          if test_text.count(legacy) != 2:
              raise SystemExit(f"Expected two legacy PDF selectors, found {test_text.count(legacy)}")
          test_path.write_text(
              test_text.replace(legacy, '"#decision-outcome-private_student_loan_payoff"'),
              encoding="utf-8",
          )
          PY
      - name: Commit generic print contract
        run: |
          if git diff --quiet; then
            echo "No print contract changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/print.css e2e/print-pdf-certification.spec.ts
          git commit -m "Generalize decision outcome print certification"
          git push origin HEAD:agent/403b-match-decision-outcome
