name: Apply patient cost-share metadata

on:
  push:
    branches:
      - agent/patient-cost-share-decision-outcome
    paths:
      - .github/workflows/apply-patient-cost-share-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-cost-share-decision-outcome
          fetch-depth: 0
      - run: python scripts/apply-patient-cost-share-metadata.py
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tools.ts src/lib/seoRegistry.ts
          git commit -m "Align patient cost-share metadata and SEO"
          git push origin HEAD:agent/patient-cost-share-decision-outcome
