name: Inspect decision outcome print selectors

on:
  push:
    branches:
      - agent/403b-match-decision-outcome
    paths:
      - .github/workflows/inspect-decision-outcome-print-selectors.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403b-match-decision-outcome
          fetch-depth: 0
      - name: Locate legacy and generic outcome selectors
        run: |
          {
            echo "# Decision outcome print selector inspection"
            echo
            echo "## Legacy selector matches"
            echo '```text'
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "private-loan-decision-outcome" . || true
            echo '```'
            echo
            echo "## Generic decision outcome matches"
            echo '```text'
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "decision-outcome-" src e2e || true
            echo '```'
            echo
            echo "## Print media sources"
            echo '```text'
            grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "@media print" src public e2e || true
            echo '```'
          } > docs/decision-outcome-print-selector-inspection.md
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/decision-outcome-print-selector-inspection.md
          git commit -m "Record decision outcome print selector inspection"
          git push origin HEAD:agent/403b-match-decision-outcome
