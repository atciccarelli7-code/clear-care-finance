name: Remove duplicate 403b PDF test

on:
  push:
    branches:
      - agent/403b-match-decision-outcome
    paths:
      - .github/workflows/remove-duplicate-403b-pdf-test.yml

permissions:
  contents: write

jobs:
  correct-duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/403b-match-decision-outcome
          fetch-depth: 0
      - name: Remove exactly one duplicate test and add uniqueness guard
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("e2e/print-pdf-certification.spec.ts")
          text = test_path.read_text(encoding="utf-8")
          title = 'test("generate 403(b) decision outcome PDFs", async ({ page }) => {'
          positions = []
          cursor = 0
          while True:
              index = text.find(title, cursor)
              if index == -1:
                  break
              positions.append(index)
              cursor = index + len(title)
          if len(positions) != 2:
              raise SystemExit(f"Expected exactly two duplicate 403(b) PDF tests, found {len(positions)}")

          second_start = positions[1]
          next_test = text.find('test("generate private student-loan decision outcome PDFs"', second_start)
          if next_test == -1:
              raise SystemExit("Could not locate the private student-loan PDF test after the duplicate")
          text = text[:second_start] + text[next_test:]
          if text.count(title) != 1:
              raise SystemExit("The corrected file does not contain exactly one 403(b) PDF test")
          test_path.write_text(text, encoding="utf-8")

          contract_path = Path("scripts/check-decision-outcome-contracts.mjs")
          contract = contract_path.read_text(encoding="utf-8")
          anchor = 'requireText(printPdfTest, \'"#decision-outcome-retirement_403b_contribution"\', "403(b) PDF certification must target the product-derived outcome ID.");\n'
          guard = '''requireText(printPdfTest, '"#decision-outcome-retirement_403b_contribution"', "403(b) PDF certification must target the product-derived outcome ID.");
const retirementPdfTestCount = (printPdfTest.match(/test\\("generate 403\\(b\\) decision outcome PDFs"/g) ?? []).length;
if (retirementPdfTestCount !== 1) failures.push(`403(b) PDF certification must be declared exactly once; found ${retirementPdfTestCount}.`);
'''
          if contract.count(anchor) != 1:
              raise SystemExit(f"Expected one PDF contract anchor, found {contract.count(anchor)}")
          contract_path.write_text(contract.replace(anchor, guard, 1), encoding="utf-8")
          PY
      - name: Commit duplicate correction
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/print-pdf-certification.spec.ts scripts/check-decision-outcome-contracts.mjs
          git commit -m "Remove duplicate 403b PDF certification"
          git push origin HEAD:agent/403b-match-decision-outcome
