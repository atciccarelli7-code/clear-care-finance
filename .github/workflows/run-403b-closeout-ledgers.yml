name: Run 403b closeout ledgers

on:
  push:
    branches:
      - docs-403b-closeout
    paths:
      - .github/workflows/run-403b-closeout-ledgers.yml

permissions:
  contents: write

jobs:
  append-ledgers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-403b-closeout
          fetch-depth: 0
      - run: python scripts/apply-403b-closeout-ledgers.py
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/DECISION_LEDGER.md docs/ai/EVIDENCE_LEDGER.md docs/ai/WORK_LEDGER.md
          git commit -m "Record 403b decision outcome release ledgers"
          git push origin HEAD:docs-403b-closeout