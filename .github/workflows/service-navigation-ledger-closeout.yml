name: Finalize structured navigation ledgers

on:
  push:
    branches:
      - codex/service-navigation-ledger-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/service-navigation-ledger-closeout
          fetch-depth: 0
      - name: Insert controlling release records
        run: |
          python - <<'PY'
          from pathlib import Path

          decision_path = Path('docs/ai/DECISION_LEDGER.md')
          evidence_path = Path('docs/ai/EVIDENCE_LEDGER.md')
          work_path = Path('docs/ai/WORK_LEDGER.md')
          packet_path = Path('docs/work-packets/2026-07-31-structured-service-navigation.md')

          decision_entry = r'''
          ### CAF-D-011 — Structured global service navigation

          - **Date:** 2026-07-31
          - **Status:** EXPERIMENT
          - **Decision:** Preserve the six broad primary destinations while replacing the generic `More` overflow and fourteen-link flat mobile sheet with one typed `Explore CAF` service-navigation system: four outcome-led groups on desktop and mobile, three direct mobile actions, concrete service names, concise outcome descriptions, and two fixed consent-gated evidence events.
          - **Rationale:** The July broad-audience navigation correctly simplified the primary layer, but its secondary overflow became inadequate as CAF accumulated 34 tools, guided decision systems, and audience-specific resources. A grouped service layer improves discoverability without undoing the primary hierarchy, deleting routes, or building another router.
          - **Evidence:** Founder observation; current header, footer, tool, route, production, Notion, Linear, and Drive review; benchmark synthesis; PR #237; exact-head CI `30676794553`; browser certification `30676794548`; Decision Journey `30676794615`; production deployment `dpl_9K3StXWYyBXg5gnCTe5kkqPui1ZY`; direct Supabase migration, role, constraint, cleanup, and advisor verification.
          - **Consequences:** Six primary destinations remain unchanged; eight generic overflow links become zero; four structured groups are introduced; the initial mobile choice set changes from fourteen flat links to three direct actions plus four disclosures; nine concrete high-value services become globally named; all 160 sitemap routes, 34 tools, 71 articles, 39 ad-eligible articles, and 21 footer links remain unchanged. Navigation evidence stores only random UUIDs, fixed events, fixed surfaces, allowlisted destination IDs, a fixed variant, and server time after analytics consent.
          - **Revisit trigger:** Twenty-eight days after production release; at least 25 distinct consented navigation-open sessions; accessibility, performance, mobile, privacy, or route regression; persistently high open-without-selection behavior at adequate volume; reduced discovery of high-value destinations; or direct user evidence that the grouping is confusing.
          - **Supersedes:** Only the generic secondary-overflow and flat-mobile portions of the July 2026 broad-audience navigation implementation. The six primary destinations and broad-audience principle remain confirmed.
          '''.strip()

          evidence_entry = r'''
          ### CAF-E-006 — Structured service-navigation release and bounded evidence controls

          - **Claim or state:** PR #237 replaced eight generic overflow links and fourteen flat mobile choices with a four-group `Explore CAF` system, preserved six primary destinations and all 160 sitemap routes, and added two consent-gated fixed navigation events to the existing private `growth_events` table. The final release passed 558 unit tests, exact-head CI, browser accessibility/mobile/performance certification, Decision Journey validation, Supabase effective-access testing, production route smoke checks, and runtime-error review.
          - **Domain:** Repository and code, production behavior, site analytics, database/auth, accessibility, and deployment/runtime
          - **Source:** GitHub PR #237 and merge `08f6a051754acdf94dec94f0b564349acc7aa1ea`; Vercel production deployment `dpl_9K3StXWYyBXg5gnCTe5kkqPui1ZY`; CI `30676794553`; browser certification `30676794548`; Decision Journey `30676794615`; Supabase project `uzfcvtgnpkvuapgrkfcb` migration `service_navigation_evidence` and direct SQL/advisor verification; Notion release record; Linear AND-99.
          - **Evidence class:** DIRECT-CURRENT
          - **Verified date:** 2026-07-31
          - **Coverage:** Exact implementation head `7f4788430ab251e9a404fcb358b0c518fce1d065`, merged production, representative worker/patient/Medicare/guide routes, the production evidence endpoint, and the active CAF Supabase project.
          - **Freshness trigger:** Twenty-eight days after release; 25 distinct consented navigation-open sessions; any navigation, route, schema, privacy, consent, performance, accessibility, or production change.
          - **Used by:** `src/components/layout/Header.tsx`, `src/data/serviceNavigation.ts`, the first-party evidence client and API, `public.growth_events`, CAF-D-011, CAF-W-008, AND-99, and experiment `SERVICE-NAVIGATION-2026-08`.
          - **Limitations:** Open and selection events do not establish comprehension, satisfaction, task completion, causal impact, or representativeness of all visitors. The benchmark analysis was an expert heuristic review, not controlled usability testing. Consent and low traffic may prevent the 25-session threshold from being reached in the initial window.
          - **Owner:** Product/information architecture, data/analytics, accessibility/reliability, privacy/legal protection, and quality/release.
          '''.strip()

          work_entry = r'''
          ### CAF-W-008 — Structured Explore CAF service-navigation release

          - **Date:** 2026-07-31
          - **Assignment:** Implement, validate, release, and document a bounded global navigation improvement based on the exceptional-design benchmark and current CAF route inventory.
          - **Starting evidence:** Six primary desktop destinations, eight generic `More` links, fourteen flat mobile links, twenty-one footer links, thirty-four public tools, zero concrete high-value tools named in global navigation, no navigation-behavior baseline, and a confirmed July rationale for preserving the broad six-item primary layer.
          - **Decision:** Preserve the six primary routes and existing homepage, footer, design system, SEO, and commercial boundaries; replace only the secondary overflow with a typed four-group `Explore CAF` system shared by desktop and mobile; add three direct mobile actions, nine named high-value services, concise outcome descriptions, and two fixed consent-gated evidence events.
          - **Implementation:** Added `src/data/serviceNavigation.ts`; rebuilt the desktop surface as a non-modal accessible popover and mobile as grouped disclosures; extended the existing evidence contract/client and `growth_events` constraints; added registry, component, parser, client, migration, and Playwright certification; and updated the browser workflow and dated work packet.
          - **Validation:** Exact-head CI `30676794553` passed with 558 tests, type/lint/governance/content/AdSense/build/bundle/prerender/sitemap/regression gates. Browser certification `30676794548` passed desktop keyboard opening, non-modal popover semantics, axe, no horizontal overflow, 320px mobile grouping, Escape/focus restoration, representative journeys, performance, premium/patient, visual, and print checks. Decision Journey `30676794615` passed. Supabase accepted valid events, rejected invalid surfaces/destinations/duplicates and public-role access, retained forced RLS and service-role SELECT/INSERT/DELETE only, and returned to zero rows. Production routes and endpoint checks passed with no release-window error logs.
          - **Release state:** PR #237 merged in `08f6a051754acdf94dec94f0b564349acc7aa1ea`; Vercel production `dpl_9K3StXWYyBXg5gnCTe5kkqPui1ZY` is READY on the canonical domain; Notion is finalized and Linear AND-99 is Done.
          - **User and business impact expected:** Completed worker, patient/caregiver, coverage, and learning services are easier to identify without removing utility or creating commercial pressure. The site can now observe navigation opens and selected destinations using fixed non-sensitive evidence.
          - **What was learned:** The correct implementation was not merely a renamed mega menu. Independent browser validation caught a real ARIA misuse when a rich sectioned panel used menu semantics; the final design uses a non-modal popover. The work also exposed a pre-existing disagreement between the generated sitemap and one internal `getIndexableRoutes()` helper for Benefits Command Center.
          - **Assumption invalidated:** A generic overflow remains adequate as the service inventory grows, a flat mobile list is the safest form of accessibility, or a component that compiles and passes unit tests necessarily has correct assistive-technology semantics.
          - **Reusable asset created:** Typed global service registry, shared desktop/mobile information model, fixed navigation evidence contract, least-privilege migration, and dedicated browser certification.
          - **Process improvement implemented:** Rich global navigation must receive semantic-role and axe testing in a real browser, and featured destinations are checked against the generated sitemap. Failed intermediate passes remain release evidence rather than being hidden.
          - **Unresolved warning:** Navigation behavior has not yet established comprehension or satisfaction; low consented volume may prevent interpretation. Separately reconcile the Benefits Command Center omission in the internal route helper with the generated sitemap authority.
          - **Evidence or event that should trigger reassessment:** Twenty-eight days, 25 distinct consented opened sessions, any accessibility/performance/mobile/privacy issue, high open-without-selection behavior, reduced destination discovery, or direct user confusion.
          - **Links:** `docs/work-packets/2026-07-31-structured-service-navigation.md`; GitHub PR #237; Notion design/release record; Linear AND-99.
          '''.strip()

          def insert_before(path: Path, marker: str, entry_id: str, entry: str):
              text = path.read_text()
              if entry_id in text:
                  return
              if marker not in text:
                  raise SystemExit(f'Marker not found in {path}: {marker}')
              path.write_text(text.replace(marker, f'\n\n{entry}\n\n{marker}', 1))

          insert_before(decision_path, '## Updating the ledger', 'CAF-D-011', decision_entry)
          insert_before(evidence_path, '## Usage rules', 'CAF-E-006', evidence_entry)

          work_text = work_path.read_text()
          if 'CAF-W-008' not in work_text:
              work_path.write_text(work_text.rstrip() + '\n\n' + work_entry + '\n')

          packet_text = packet_path.read_text()
          closeout_marker = '## 19. Final release closeout'
          if closeout_marker not in packet_text:
              packet_path.write_text(packet_text.rstrip() + r'''

          ## 19. Final release closeout

          - **Technical validation:** PASS. CI `30676794553`, browser certification `30676794548`, and Decision Journey `30676794615` passed on exact head `7f4788430ab251e9a404fcb358b0c518fce1d065`.
          - **Business validation:** PASS. Six primary destinations remain intact; eight generic overflow links become four outcome-led groups; nine concrete services are named; all routes, tools, articles, AdSense dispositions, homepage, footer, and commercial boundaries are preserved.
          - **Database/privacy:** Migration `service_navigation_evidence` is applied. Forced RLS, no public policies, and service-role SELECT/INSERT/DELETE only were verified. Valid events passed; invalid events, duplicates, anonymous reads, and authenticated writes failed. Controlled rows were deleted back to zero.
          - **Release:** PR #237 merged at `08f6a051754acdf94dec94f0b564349acc7aa1ea`; Vercel production `dpl_9K3StXWYyBXg5gnCTe5kkqPui1ZY` is READY with no alias error.
          - **Production smoke:** Homepage, Benefits Command Center, Medical Bill Review, Medicare/Medicaid, and Quick Guides returned HTTP 200. The evidence endpoint returned expected POST-only/no-store/noindex behavior. No production error logs were found in the inspected release window.
          - **Measurement:** `SERVICE-NAVIGATION-2026-08`; 28 days; interpret at 25 distinct consented navigation-open sessions, otherwise report raw counts and extend.
          - **Known process debt:** Reconcile the internal `getIndexableRoutes()` omission of Benefits Command Center with the generated sitemap authority in a separate bounded change.
          '''.strip() + '\n')

          Path('.github/workflows/service-navigation-ledger-closeout.yml').unlink()
          PY
      - name: Commit ledger closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize structured navigation release ledgers"
          git push origin HEAD:codex/service-navigation-ledger-closeout
